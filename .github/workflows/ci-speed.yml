# ci-speed benchmark, wave 4: arm64 x optimised dependencies, 2 replicas (jeprecated/ruff fork only; never upstream).
# The `test` and `clippy` jobs copy upstream ci.yaml's "cargo test (linux)" and "cargo clippy"
# steps; only the matrix fields vary. PHASE comes from .github/ci-speed/phase: `seed` saves the
# caches, `measure` only restores them (reruns of a measure run are the repeats).
name: ci-speed

on:
  push:
    branches: ["ci-speed/**"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  UV_LOCKED: 1
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_PROFILE_DEV_LTO: "false"
  CARGO_PROFILE_DEV_OPT_LEVEL: 0
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  PYTHON_VERSION: "3.14"
  NEXTEST_PROFILE: ci
  MDTEST_EXTERNAL: "1"

jobs:
  test:
    name: "test ${{ matrix.v.id }} r${{ matrix.rep }}"
    runs-on: ${{ matrix.v.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        v:
          - { id: base-rc, runner: ubuntu-latest, cache: rc }
          - { id: deps3-rc, runner: ubuntu-latest, cache: rc, preset: deps3 }
          - { id: arm-rc, runner: ubuntu-24.04-arm, cache: rc }
          - { id: arm-deps3-rc, runner: ubuntu-24.04-arm, cache: rc, preset: deps3 }
        rep: [1, 2]
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # The workflow default is upstream's 0; the opt1 variant uses Cargo.toml's own dev opt-level 1.
      CARGO_PROFILE_DEV_OPT_LEVEL: ${{ matrix.v.opt || 0 }}
      PRESET: ${{ matrix.v.preset || '' }}
      VARIANT: ${{ matrix.v.id }}
      CACHE: ${{ matrix.v.cache }}
      LINKER: ${{ matrix.v.linker || 'default' }}
      WRAPPER: ${{ matrix.v.wrapper || 'none' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 20
      - name: bench info
        id: phase
        run: |
          echo "phase=$(cat .github/ci-speed/phase)" >> "$GITHUB_OUTPUT"
          bash .github/ci-speed/variant.sh info
      - if: matrix.v.cache == 'rc'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.v.id }}
          save-if: ${{ steps.phase.outputs.phase == 'seed' }}
          cache-on-failure: true
      - if: matrix.v.cache == 'golden'
        name: restore golden target
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: golden-${{ matrix.v.id }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: golden-${{ matrix.v.id }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
      - if: matrix.v.cache == 'sccache'
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: "Install Rust toolchain"
        run: rustup show
      - if: matrix.v.cache == 'golden'
        name: golden mtimes
        run: bash .github/ci-speed/variant.sh mtime
      - name: variant tools
        run: bash .github/ci-speed/variant.sh tools
      - uses: ./.github/actions/setup-ruff-workspace
        with:
          enable-cache: "true"
          cache-python: true
      # Added for the benchmark: the test build on its own, with --timings, so compile and run
      # time separate. The next step's nextest run finds these binaries fresh.
      - name: "Build tests"
        id: build
        run: cargo test --no-run --all-features --locked --workspace --timings
      - name: "Run tests"
        run: uv run --locked --only-dev cargo insta test --all-features --unreferenced reject --test-runner nextest --disable-nextest-doctest
      - name: "Run doctests"
        run: cargo test --doc --all-features
      - name: "Check parser without stacker"
        run: cargo check --locked -p ruff_python_parser --no-default-features --all-targets
      - name: Dogfood ty on py-fuzzer
        run: uv run --quiet --python="${PYTHON_VERSION}" --project=./python/py-fuzzer cargo run --quiet -p ty check --project=./python/py-fuzzer --color=always
      - name: Dogfood ty on ty_benchmark
        run: uv run --quiet --project=./scripts/ty_benchmark cargo run --quiet -p ty check --project=./scripts/ty_benchmark --color=always
      - name: Dogfood ty on scripts
        env:
          TY_UV: scripts
          UV_LOCKED: "true"
          UV_PYTHON: ${{ env.PYTHON_VERSION }}
        run: |
          uv run --locked scripts/check-scripts.py --write-ty-args-file "$RUNNER_TEMP/script-paths.txt"
          cargo run --quiet -p ty check "@$RUNNER_TEMP/script-paths.txt" --color=always
      - run: cargo doc --all --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - run: cargo doc --no-deps -p ty_python_semantic -p ty_python_core -p ty_module_resolver -p ty_site_packages -p ty_combine -p ty_project -p ty_ide -p ty_wasm -p ty_vendored -p ty_static -p ty -p ty_test -p ruff_db -p ruff_python_formatter --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: bench record
        if: always()
        run: bash .github/ci-speed/variant.sh record
      - if: always() && matrix.v.cache == 'golden' && steps.phase.outputs.phase == 'seed' && steps.build.outcome == 'success'
        run: git rev-parse HEAD > target/.golden-sha
      - if: always() && matrix.v.cache == 'golden' && steps.phase.outputs.phase == 'seed' && steps.build.outcome == 'success'
        name: save golden target
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: golden-${{ matrix.v.id }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-test-${{ matrix.v.id }}-r${{ matrix.rep }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bench
          retention-days: 30

